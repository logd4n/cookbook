<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Моя кулинарная книга</title>
    <link rel="icon" type="image/x-icon" sizes="32x32" href="/static/favicon.ico?v=5">
    <link rel="stylesheet" href="./static/css/styles.css?v=7">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>

<body>
    <!--<header> 
        <h1><i class="fas fa-utensils"></i> Моя кулинарная книга</h1>
    </header>-->

    <!-- НАВИГАЦИОННАЯ ПАНЕЛЬ -->
    <nav class="navigation-panel">
        <h1><i class="fas fa-utensils"></i> Моя кулинарная книга</h1>
        <div class="nav-buttons">
            <a href="#" id="mainPage" class="nav-btn active">
                <i class="fas fa-plus-circle"></i>
                Создать рецепт
                <script>
                // window.location.hostname сам определит IP или домен, по которому открыт сайт
                const host = window.location.hostname; 
                document.getElementById('mainPage').href = `http://${host}:8080/`;
                </script>
            </a>
            <a href="#" id="searchPage" class="nav-btn">
                <i class="fas fa-search"></i>
                Найти рецепт
                <script>
                document.getElementById('searchPage').href = `http://${host}:8080/search`;
                </script>
            </a>
        </div>
    </nav>

    <main>
        <section class="add-recipe">
            <h2>Добавить новый рецепт</h2>
            <form id="recipe-form">
                <div class="form-group">
                    <label for="recipe-name">Название блюда:</label>
                    <input type="text" id="recipe-name" required>
                </div>
                
                <div class="form-group">
                    <label for="recipe-category">Категория:</label>
                    <select id="recipe-category" required>
                        <option value="">Выберите категорию</option>
                        <option value="Завтраки">Завтраки</option>
                        <option value="Основные блюда">Основные блюда</option>
                        <option value="Десерты">Десерты</option>
                        <option value="Напитки">Напитки</option>
                        <option value="Закуски">Закуски</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label for="recipe-ingredients">Ингредиенты:</label>
                    <textarea id="recipe-ingredients" rows="4" required placeholder="Каждый ингредиент с новой строки"></textarea>
                </div>
                
                <div class="form-group">
                    <label for="recipe-instructions">Инструкция приготовления:</label>
                    <textarea id="recipe-instructions" rows="6" required></textarea>
                </div>
                
                <button type="submit" class="btn"><i class="fas fa-plus-circle"></i> Добавить рецепт</button>
            </form>
        </section>
    </main>

    <footer>
        <p>© Добавление рецептов для моей любимой 🩷
            <br> v2.4.2 </br>
            <i> Soft By LOG</i>
        </p>
    </footer>

    <script src="./static/js/post_script.js?v=10"></script>
</body>
</html>
